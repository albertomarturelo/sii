name: Publish packages

# CD for the public npm packages — @albertomarturelo/sii-core, -cli, -mcp — triggered
# by a `v*` git tag (ADR-015 flow, registry per ADR-019, surfaces added per ADR-021).
# The three versions move in LOCKSTEP: bump all of packages/{core,cli,mcp}/package.json
# to the same version, merge, then push a matching tag (`v0.5.0` ⇒ version 0.5.0).
# `pnpm -r publish` is idempotent — already-published versions are skipped. Needs an
# `NPM_TOKEN` repo secret (npm automation token, publish rights on `@albertomarturelo`).
#
# A second job then publishes the matching GITHUB RELEASE, so a tag is never a silent
# artifact: its notes are the version's section lifted from the root CHANGELOG.md (the
# curated text, not autogenerated commit soup). It runs only after npm publish succeeds
# AND the registry serves all three versions — a release must never announce something
# that cannot be installed — and is idempotent, so a re-run on an existing release is a
# no-op.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    name: Build + publish (core + cli + mcp)
    runs-on: ubuntu-latest
    # Read-only ON PURPOSE: this job runs `pnpm install` (third-party postinstall scripts)
    # and a build. Write access to the repo lives in the `release` job below, which only
    # checks out and calls `gh` — keeping the supply-chain surface away from write rights.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      # No `version:` here — action-setup reads pnpm from package.json
      # `packageManager` (the single source of truth), matching ci.yml.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org
          scope: '@albertomarturelo'

      - name: Install (frozen)
        run: pnpm install --frozen-lockfile

      - name: Typecheck + build (tsc -b)
        run: pnpm build

      - name: Verify tag matches all package versions (lockstep)
        # Guard against a mismatched tag publishing a stale version. All three
        # packages must equal the tag (ADR-021 — versions move in lockstep).
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          for pkg in core cli mcp; do
            version=$(node -p "require('./packages/${pkg}/package.json').version")
            if [ "$version" != "$tag" ]; then
              echo "::error::Tag '${GITHUB_REF_NAME}' does not match packages/${pkg} version '${version}'. Bump all three package.json in lockstep or retag."
              exit 1
            fi
          done
          echo "Tag ${GITHUB_REF_NAME} matches core + cli + mcp."

      - name: Verify the changelog fits the bump (ADR-021 amendment)
        # The release commit moves `## Unreleased` into the version's sections, so at the tag it
        # must be empty: an entry left there is a change that ships without being announced.
        # Pre-1.0, a PATCH carries fixes only; Added / Removed / Breaking need a MINOR. Both
        # rules were met by memory before (0.12.2 shipped an `### Added` in core).
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          # A section's text, from its `## ` heading to the next one, HTML comments dropped.
          section() {
            awk -v head="$1" '
              index($0, head) == 1 { inside = 1; next }
              inside && /^## / { exit }
              inside {
                line = $0
                if (incomment || line ~ /<!--/) { incomment = (line !~ /-->/); next }
                print line
              }
            ' "$2"
          }
          left="$(section '## Unreleased' CHANGELOG.md | grep -v '^[[:space:]]*$' || true)"
          if [ -n "$left" ]; then
            echo "::error::CHANGELOG.md still has entries under '## Unreleased'. Move them into the ${version} sections in the release commit, then retag."
            printf '%s\n' "$left"
            exit 1
          fi
          patch="${version##*.}"
          if [ "$patch" != "0" ]; then
            bad=0
            for f in CHANGELOG.md packages/core/CHANGELOG.md packages/cli/CHANGELOG.md packages/mcp/CHANGELOG.md; do
              hits="$(section "## ${version} " "$f" | grep -nE '^### (Added|Removed|Breaking)|\*\*Breaking' || true)"
              if [ -n "$hits" ]; then
                echo "::error file=${f}::${version} is a PATCH but its section carries:"
                printf '%s\n' "$hits"
                bad=1
              fi
            done
            if [ "$bad" = 1 ]; then
              echo "::error::Added / Removed / Breaking ship in a MINOR before 1.0. Bump to the next minor and retag."
              exit 1
            fi
          fi
          echo "Changelog fits ${version}: Unreleased is empty and the sections match the bump."

      - name: Publish to public npm (idempotent — skips already-published versions)
        run: pnpm -r publish --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Wait until the registry serves all three packages
        # `pnpm -r publish` returning is not "installable": npm processes a publish
        # asynchronously ("may take a few minutes to become available"). On 0.10.0 sii-core
        # took ~2.5 min to appear while cli/mcp, which depend on `^<version>`, were already
        # live, so a clean `npm i @albertomarturelo/sii-cli` failed with ETARGET in between
        # (#123). Poll the abbreviated packument, the document `npm install` itself resolves
        # against, until each one lists the version; `release` (needs: publish) then only
        # announces what installs. A version already live (a re-run) passes on the first try.
        # Backstop above TIMEOUT_SECONDS: the script's deadline is the real limit.
        timeout-minutes: 15
        env:
          TIMEOUT_SECONDS: 600
          POLL_SECONDS: 15
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          deadline=$(( $(date +%s) + TIMEOUT_SECONDS ))
          for pkg in core cli mcp; do
            name="@albertomarturelo/sii-${pkg}"
            url="https://registry.npmjs.org/@albertomarturelo%2Fsii-${pkg}"
            # A transient registry error is just "not yet": retried until the deadline. Each
            # attempt is time-bounded, so a stalled connection cannot outlive the deadline;
            # curl's stderr stays visible, since it only speaks on a real failure.
            until curl -fsS --connect-timeout 10 --max-time 30 \
                -H 'Accept: application/vnd.npm.install-v1+json' "$url" \
                | jq -e --arg v "$version" '.versions | has($v)' >/dev/null; do
              if [ "$(date +%s)" -ge "$deadline" ]; then
                echo "::error::${name}@${version} is still not served by registry.npmjs.org after ${TIMEOUT_SECONDS}s. The release was NOT announced. Check the package on npm, then re-run this workflow."
                exit 1
              fi
              echo "${name}@${version} not served yet; retrying in ${POLL_SECONDS}s."
              sleep "$POLL_SECONDS"
            done
            echo "${name}@${version} is served by the registry."
          done

  release:
    name: GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release; the only job that may write to the repo
    steps:
      - uses: actions/checkout@v5

      - name: Create the GitHub release from CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"

          # Idempotent: re-running the workflow (or tagging a release created by hand)
          # must not fail the build.
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release ${tag} already exists — nothing to do."
            exit 0
          fi

          # Notes = this version's section of the root changelog, verbatim.
          notes="$(mktemp)"
          awk -v ver="$version" '
            index($0, "## " ver " ") == 1 { inside = 1; next }
            inside && /^## / { exit }
            inside {
              if (!started && $0 ~ /^[[:space:]]*$/) next  # drop the blank line after the heading
              started = 1
              print
            }
          ' CHANGELOG.md > "$notes"

          # Title from the heading `## <version> — <date> — <headline>`; the sed leaves the
          # line untouched if it does not match, so detect that and fall back.
          title="v${version}"
          heading="$(grep -m1 "^## ${version} " CHANGELOG.md || true)"
          if [ -n "$heading" ]; then
            derived="$(printf '%s' "$heading" \
              | sed -E 's/^## ([^ ]+) — [0-9]{4}-[0-9]{2}-[0-9]{2} — (.*)$/v\1 — \2/')"
            case "$derived" in '## '*) ;; *) title="$derived" ;; esac
          fi

          if [ -s "$notes" ]; then
            echo "Creating release ${tag} with notes from CHANGELOG.md."
            gh release create "$tag" --title "$title" --notes-file "$notes" --latest
          else
            # No changelog section (e.g. a hotfix tag): better an autogenerated release
            # than none, but say so loudly — the changelog entry is missing.
            echo "::warning::No '## ${version}' section in CHANGELOG.md; falling back to autogenerated notes."
            gh release create "$tag" --title "$title" --generate-notes --latest
          fi
